<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav>
            <div class="left">Kanban</div>
            <div class="theme-selector">
                <button class="theme-btn" data-theme="dark" title="Dark">🌙</button>
                <button class="theme-btn" data-theme="medium-dark" title="Medium Dark">🌤️</button>
                <button class="theme-btn" data-theme="medium" title="Medium">☁️</button>
                <button class="theme-btn" data-theme="lofi" title="Lofi Light">☀️</button>
                <button class="theme-btn" data-theme="light" title="Light">✨</button>
            </div>
            <div class="right" id="toggle-modal"><button>Add new task</button></div>
        </nav>
        <section class="board">
            <div id="todo" class="task-column">
                <div class="heading">
                    <div class="left">To Do</div>
                    <div class="right">0</div>
                </div>
            </div>
            <div id="progress" class="task-column">
                <div class="heading">
                    <div class="left">In Progress</div>
                    <div class="right">0</div>
                </div>
            </div>
            <div id="done" class="task-column">
                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right">0</div>
                </div>
            </div>
        </section>
    </main>
    <div class="modal add-new-task">
        <div class="bg"></div>
        <div class="center">
            <input 
                type="text"
                id="task-title-input"
                placeholder="Task Title"
            />
            <textarea placeholder="Task Description"></textarea>
            <button id="add-new-task" class="add-task-btn">Add Task</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
